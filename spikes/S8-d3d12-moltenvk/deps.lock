# S8 spike dependency lock. Exact versions of everything this spike fetches,
# builds against or runs on. `check-deps.sh` compares this file with the
# machine; `build.sh` refuses to build when they differ (override: S8_UNLOCKED=1).
# Recorded 2026-11-23 on Apple M3, macOS 27.3.
#
# Formats, one entry per line:
#   source    <name> <url> <ref> <sha>      (top-level pins also in scripts/versions.lock)
#   submodule <parent> <path> <sha>         (fixed by the parent commit; checked after fetch)
#   brew      <formula> <version>           (`brew list --versions`)
#   pip       <package> <version>           (installed in build/venv, shared with scripts/build-deps.sh)
#   tool      <name> <version>              (system tools; informational, not checked)

