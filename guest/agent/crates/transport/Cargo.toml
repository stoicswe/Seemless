[package]
name = "transport"
description = "virtio-serial port discovery and overlapped I/O; the local named pipe between service and session agent (docs/06)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
proto = { path = "../proto" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
