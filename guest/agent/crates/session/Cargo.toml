[package]
name = "session"
description = "Per-user session agent: windows, capture, input assist, clipboard, shell integration (docs/06)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "seemless-agent"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
proto = { path = "../proto" }
transport = { path = "../transport" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
