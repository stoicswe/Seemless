[package]
name = "svc"
description = "LocalSystem Windows service: owns the virtio-serial ports and supervises the session agent (docs/06)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "seemless-agent-svc"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
proto = { path = "../proto" }
transport = { path = "../transport" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Services", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Environment", "Win32_System_Threading"] }
