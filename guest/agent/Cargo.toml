# Guest agent workspace (docs/06). Cross-compiled from macOS:
#   cargo xwin build --target aarch64-pc-windows-msvc --release
# Pure-logic crates (windows-model, proto) are tested on the Mac host.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
