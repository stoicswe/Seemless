# Link the MSVC C runtime statically: a clean Windows has no
# VCRUNTIME140.dll, so a dynamically linked agent fails to start (WP4.2).
# With +crt-static the UCRT is linked in too: the exes import only system DLLs.
# Redistribution terms of the static CRT: docs/10 Q12.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
